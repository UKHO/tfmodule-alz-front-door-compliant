name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - modules/**
      - scripts/**
      - examples/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - modules/**
      - scripts/**
      - examples/**

resources:
  containers:
    - container: TerraformContainer
      image: ukhydrographicoffice/terraform-test-toolset:latest

variables:
  # Service connection for the SPN (workload identity federation) used to authenticate
  # Terraform against the Front Door dev subscription during compliance test plan generation.
  # No RBAC roles specific to Front Door are required — Contributor on the dev subscription
  # is sufficient, since the compliance job only ever runs `terraform plan` (never apply)
  # against local-backend fixtures.
  - name: ComplianceServiceConnection
    value: "Front Door Dev"

  # Service connection for the SPN used to authenticate Terraform against the Front Door
  # Dev subscription for the delivery module overlap tests. Unlike ComplianceServiceConnection,
  # this job runs real `terraform apply`/`destroy` against live Azure resources, so the SPN
  # needs Contributor (or higher) on the subscription. The subscription ID itself is inferred
  # at runtime from the authenticated service connection context (see "Authenticate (OIDC) for
  # overlap tests" step below) rather than hardcoded here.
  - name: OverlapTestServiceConnection
    value: "Front Door Dev"

  # Latest terraform 1.15.x patch — the newest release still recognised by
  # terraform-compliance's hardcoded supported-version check. Update only once
  # terraform-compliance publishes support for a newer terraform minor version.
  - name: ComplianceTerraformVersion
    value: "1.15.9"

stages:

# ─── Stage 1: Validate ────────────────────────────────────────────────────────

  - stage: Validate
    displayName: "Stage 1: Validate"
    jobs:

      # ── Static analysis: fmt, lint, validate, docs ──

      - job: StaticChecks
        displayName: "Static Checks (fmt, lint, validate, docs)"
        pool:
          vmImage: ubuntu-latest
        container: TerraformContainer
        steps:
          - checkout: self

          - pwsh: scripts/Invoke-TfFmt.ps1 -TerraformDir modules/
            displayName: "terraform fmt check"

          - pwsh: scripts/Invoke-TfLint.ps1 -TerraformDir modules/
            displayName: "TFLint"

          - pwsh: scripts/Invoke-TfValidate.ps1 -ModulesDir modules/
            displayName: "terraform validate"

          - pwsh: scripts/Invoke-TfDocs.ps1 -ModulesDir modules/
            displayName: "terraform-docs check"
            continueOnError: "true"

      # ── Snyk IaC scan: front-door-platform ──

      - job: SnykScanPlatform
        displayName: "Snyk IaC Scan (front-door-platform)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UkhoSnykScanTask@0
            displayName: "Snyk IaC scan — front-door-platform"
            inputs:
              failOnIssues: true
              organization: "f8cb0532-afc8-444d-b6cf-97c0cb941e10"
              serviceConnectionEndpoint: "Snyk Auth"
              testType: iac
              monitorWhen: never
              severityThreshold: high
              targetFile: modules/front-door-platform

      # ── Snyk IaC scan: front-door-delivery ──

      - job: SnykScanDelivery
        displayName: "Snyk IaC Scan (front-door-delivery)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UkhoSnykScanTask@0
            displayName: "Snyk IaC scan — front-door-delivery"
            inputs:
              failOnIssues: true
              organization: "f8cb0532-afc8-444d-b6cf-97c0cb941e10"
              serviceConnectionEndpoint: "Snyk Auth"
              testType: iac
              monitorWhen: never
              severityThreshold: high
              targetFile: modules/front-door-delivery

      # ── terraform-compliance against module fixtures ──

      - job: ComplianceTests
        displayName: "Compliance Tests (terraform-compliance)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        container: TerraformContainer
        steps:
          - checkout: self

          # Pin the terraform binary used for compliance plan generation. TerraformContainer
          # is built from a mutable :latest tag and tracks whatever terraform release is
          # newest at build time. terraform-compliance hardcodes a list of terraform versions
          # it recognises and rejects anything newer (e.g. "FATAL ERROR: Unsupported terraform
          # version"), so we can't rely on the container's bundled version. Installing a known
          # -compatible version here and prepending it to PATH makes this job resilient to
          # image drift. Bump ComplianceTerraformVersion when terraform-compliance adds support
          # for newer terraform releases.
          - pwsh: |
              $version = "$(ComplianceTerraformVersion)"
              $installDir = "$(Agent.TempDirectory)/terraform-pinned"
              New-Item -ItemType Directory -Path $installDir -Force | Out-Null

              $zipPath = Join-Path $installDir "terraform.zip"
              Invoke-WebRequest -Uri "https://releases.hashicorp.com/terraform/$version/terraform_${version}_linux_amd64.zip" -OutFile $zipPath
              Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
              Remove-Item $zipPath

              Write-Host "##vso[task.prependpath]$installDir"
              Write-Host "Pinned terraform $version installed to $installDir"
            displayName: "Pin terraform version for compliance plan generation"

          # Federate to the Front Door dev subscription using the SPN's workload identity
          # (no client secret involved). addSpnToEnvironment exposes servicePrincipalId,
          # tenantId, and idToken for a WIF-based service connection; these are re-published
          # as pipeline variables so later steps in this job see them as ARM_* env vars,
          # which is what the azurerm Terraform provider expects for OIDC auth.
          - task: AzureCLI@2
            displayName: "Authenticate (OIDC) for compliance plan generation"
            inputs:
              azureSubscription: "$(ComplianceServiceConnection)"
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                $subscriptionId = az account show --query id -o tsv
                Write-Host "##vso[task.setvariable variable=ARM_CLIENT_ID]$env:servicePrincipalId"
                Write-Host "##vso[task.setvariable variable=ARM_TENANT_ID]$env:tenantId"
                Write-Host "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$env:idToken"
                Write-Host "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$subscriptionId"
                Write-Host "##vso[task.setvariable variable=ARM_USE_OIDC]true"

          # Keep this install until the container image is confirmed to include terraform-compliance.
          - pwsh: |
              if (Get-Command terraform-compliance -ErrorAction SilentlyContinue) {
                Write-Host "terraform-compliance already available in PATH."
                exit 0
              }

              if (Get-Command pip3 -ErrorAction SilentlyContinue) {
                pip3 install terraform-compliance
                exit $LASTEXITCODE
              }

              if (Get-Command python3 -ErrorAction SilentlyContinue) {
                python3 -m pip install terraform-compliance
                exit $LASTEXITCODE
              }

              if (Get-Command python -ErrorAction SilentlyContinue) {
                python -m pip install terraform-compliance
                exit $LASTEXITCODE
              }

              Write-Error "terraform-compliance not found, and no python/pip installer is available in this container image."
              exit 1
            displayName: "Install terraform-compliance"

          - pwsh: |
              scripts/Invoke-TfCompliance.ps1 `
                -SubscriptionId "$(ARM_SUBSCRIPTION_ID)"
            displayName: "terraform compliance"
            env:
              # ARM_OIDC_TOKEN is a secret pipeline variable — Azure Pipelines does not
              # auto-expose secret variables as environment variables to steps, so it must
              # be mapped explicitly here or Terraform falls back to (unavailable) CLI auth.
              ARM_OIDC_TOKEN: $(ARM_OIDC_TOKEN)

      # ── Delivery module overlap tests (native terraform test, apply mode) ──
      # Stands up two front-door-delivery instances against a shared platform profile/
      # endpoint (see tests/) and asserts neither can affect or override the other's
      # routes, origins, origin groups, rule sets or custom domains (no resource-name
      # collisions, no patterns_to_match/custom-domain overlap on the shared endpoint,
      # and each route resolves only to its own origins).
      # Runs real terraform apply/destroy against the Front Door Dev subscription, so
      # it's scoped to only run when modules/front-door-delivery/** actually changed.

      - job: DeliveryOverlapTests
        displayName: "Delivery Module Overlap Tests (terraform test, apply)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        container: TerraformContainer
        steps:
          - checkout: self
            fetchDepth: 0

          - pwsh: |
              $changed = $false
              if ($env:BUILD_REASON -eq "PullRequest") {
                $targetBranch = "$(System.PullRequest.TargetBranchName)"
                git fetch origin $targetBranch --depth=50 2>$null
                $diff = git diff --name-only "origin/$targetBranch...HEAD" -- modules/front-door-delivery
              }
              else {
                $diff = git diff --name-only HEAD~1 HEAD -- modules/front-door-delivery 2>$null
              }
              if ($diff) { $changed = $true }
              Write-Host "front-door-delivery changed: $changed"
              Write-Host "##vso[task.setvariable variable=DeliveryChanged]$changed"
            displayName: "Detect front-door-delivery module changes"

          # Federate to the Front Door Dev subscription using the SPN's workload identity
          # (no client secret involved) — same mechanism as the compliance job's OIDC step,
          # but this SPN needs write (Contributor+) RBAC since this job runs real apply/destroy.
          # Subscription ID is read from the authenticated context (az account show), not
          # hardcoded, matching the ComplianceTests job's pattern above.
          - task: AzureCLI@2
            displayName: "Authenticate (OIDC) for overlap tests"
            condition: and(succeeded(), eq(variables['DeliveryChanged'], 'true'))
            inputs:
              azureSubscription: "$(OverlapTestServiceConnection)"
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                $subscriptionId = az account show --query id -o tsv
                Write-Host "##vso[task.setvariable variable=ARM_CLIENT_ID]$env:servicePrincipalId"
                Write-Host "##vso[task.setvariable variable=ARM_TENANT_ID]$env:tenantId"
                Write-Host "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$env:idToken"
                Write-Host "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$subscriptionId"
                Write-Host "##vso[task.setvariable variable=ARM_USE_OIDC]true"

          - pwsh: |
              scripts/Invoke-DeliveryOverlapTests.ps1 `
                -SubscriptionId "$(ARM_SUBSCRIPTION_ID)"
            displayName: "Delivery overlap tests"
            condition: and(succeeded(), eq(variables['DeliveryChanged'], 'true'))
            env:
              # ARM_OIDC_TOKEN is a secret pipeline variable — Azure Pipelines does not
              # auto-expose secret variables as environment variables to steps, so it must
              # be mapped explicitly here or Terraform falls back to (unavailable) CLI auth.
              ARM_OIDC_TOKEN: $(ARM_OIDC_TOKEN)

# ─── Stage 2: Tag Release ─────────────────────────────────────────────────────

  - stage: TagRelease
    displayName: "Stage 2: Tag Release"
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: CreateTag
        displayName: "Create semantic version git tag"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - pwsh: |
              $tag = "v$(Build.BuildId)"
              git config user.email "build@azure-devops"
              git config user.name  "Azure DevOps"
              git tag $tag
              git push origin $tag
              Write-Host "Tagged release: $tag"
            displayName: "Tag v$(Build.BuildId)"
