name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - modules/**
      - scripts/**
      - examples/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - modules/**
      - scripts/**
      - examples/**

resources:
  containers:
    - container: TerraformContainer
      image: ukhydrographicoffice/terraform-test-toolset:latest

variables:
  # Dummy subscription GUID for offline compliance plan generation in module CI.
  - name: ComplianceSubscriptionId
    value: "00000000-0000-0000-0000-000000000000"

stages:

# ─── Stage 1: Validate ────────────────────────────────────────────────────────

  - stage: Validate
    displayName: "Stage 1: Validate"
    jobs:

      # ── Static analysis: fmt, lint, validate, docs ──

      - job: StaticChecks
        displayName: "Static Checks (fmt, lint, validate, docs)"
        pool:
          vmImage: ubuntu-latest
        container: TerraformContainer
        steps:
          - checkout: self

          - pwsh: scripts/Invoke-TfFmt.ps1 -TerraformDir modules/
            displayName: "terraform fmt check"

          - pwsh: scripts/Invoke-TfLint.ps1 -TerraformDir modules/
            displayName: "TFLint"

          - pwsh: scripts/Invoke-TfValidate.ps1 -ModulesDir modules/
            displayName: "terraform validate"

          - pwsh: scripts/Invoke-TfDocs.ps1 -ModulesDir modules/
            displayName: "terraform-docs check"
            continueOnError: "true"

      # ── Snyk IaC scan: front-door-platform ──

      - job: SnykScanPlatform
        displayName: "Snyk IaC Scan (front-door-platform)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UkhoSnykScanTask@0
            displayName: "Snyk IaC scan — front-door-platform"
            inputs:
              failOnIssues: true
              organization: "f8cb0532-afc8-444d-b6cf-97c0cb941e10"
              serviceConnectionEndpoint: "Snyk Auth"
              testType: iac
              monitorWhen: never
              severityThreshold: high
              targetFile: modules/front-door-platform

      # ── Snyk IaC scan: front-door-delivery ──

      - job: SnykScanDelivery
        displayName: "Snyk IaC Scan (front-door-delivery)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UkhoSnykScanTask@0
            displayName: "Snyk IaC scan — front-door-delivery"
            inputs:
              failOnIssues: true
              organization: "f8cb0532-afc8-444d-b6cf-97c0cb941e10"
              serviceConnectionEndpoint: "Snyk Auth"
              testType: iac
              monitorWhen: never
              severityThreshold: high
              targetFile: modules/front-door-delivery

      # ── terraform-compliance against module fixtures ──

      - job: ComplianceTests
        displayName: "Compliance Tests (terraform-compliance)"
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        container: TerraformContainer
        steps:
          - checkout: self

          # TEMPORARY DEBUG: confirm whether az CLI is present in the container image.
          # Remove this step once the auth mechanism decision (AzureCLI@2 vs OIDC-without-az) is made.
          - pwsh: |
              if (Get-Command az -ErrorAction SilentlyContinue) {
                Write-Host "az CLI found:"
                az version
              }
              else {
                Write-Host "az CLI NOT found in this container image."
              }
            displayName: "DEBUG: check az CLI presence"

          # Keep this install until the container image is confirmed to include terraform-compliance.
          - pwsh: |
              if (Get-Command terraform-compliance -ErrorAction SilentlyContinue) {
                Write-Host "terraform-compliance already available in PATH."
                exit 0
              }

              if (Get-Command pip3 -ErrorAction SilentlyContinue) {
                pip3 install terraform-compliance
                exit $LASTEXITCODE
              }

              if (Get-Command python3 -ErrorAction SilentlyContinue) {
                python3 -m pip install terraform-compliance
                exit $LASTEXITCODE
              }

              if (Get-Command python -ErrorAction SilentlyContinue) {
                python -m pip install terraform-compliance
                exit $LASTEXITCODE
              }

              Write-Error "terraform-compliance not found, and no python/pip installer is available in this container image."
              exit 1
            displayName: "Install terraform-compliance"

          - pwsh: |
              scripts/Invoke-TfCompliance.ps1 `
                -SubscriptionId "$(ComplianceSubscriptionId)"
            displayName: "terraform compliance"

# ─── Stage 2: Tag Release ─────────────────────────────────────────────────────

  - stage: TagRelease
    displayName: "Stage 2: Tag Release"
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: CreateTag
        displayName: "Create semantic version git tag"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - pwsh: |
              $tag = "v$(Build.BuildId)"
              git config user.email "build@azure-devops"
              git config user.name  "Azure DevOps"
              git tag $tag
              git push origin $tag
              Write-Host "Tagged release: $tag"
            displayName: "Tag v$(Build.BuildId)"
